name: Dashboard publisher admission
on: [push, pull_request]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r packages/dashboard-publish/requirements.txt
      - run: python -m unittest discover -s packages/dashboard-publish -p 'test_*.py' -v
