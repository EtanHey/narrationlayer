name: TypeScript tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: typescript-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r packages/dashboard-publish/requirements.txt
      - run: bun install --frozen-lockfile
      - name: Install ffmpeg
        run: brew install ffmpeg || (sleep 15 && brew install ffmpeg)
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - run: ffmpeg -version && ffprobe -version
      - run: bun test
      - run: bunx tsc --noEmit
        if: ${{ !cancelled() }}
      - name: Check narration contract model
        if: ${{ !cancelled() }}
        run: |
          java -version
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/tlaplus"
          jar="$HOME/.local/share/tlaplus/tla2tools-1.7.4.jar"
          curl --fail --location --silent --show-error --retry 1 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | shasum -a 256 -c -
          cat > "$HOME/.local/bin/tlc" <<'WRAPPER'
          #!/bin/sh
          exec java -XX:+UseParallelGC -cp "$HOME/.local/share/tlaplus/tla2tools-1.7.4.jar" tlc2.TLC "$@"
          WRAPPER
          chmod +x "$HOME/.local/bin/tlc"
          formal/narration-contract/check.sh
